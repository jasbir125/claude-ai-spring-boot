<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" role="img" aria-labelledby="title desc">
  <title id="title">How the enterprise-spring-boot plugin works</title>
  <desc id="desc">A developer runs Claude Code, which loads the enterprise-spring-boot plugin. The plugin's commands run its agents, the agents follow its skills, and together they generate and review Spring Boot microservices that talk to each other through Kafka.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .h1 { font-size: 26px; font-weight: 700; fill: #1f2328; }
      .sub { font-size: 14px; fill: #57606a; }
      .h2 { font-size: 16px; font-weight: 700; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: 0.8px; }
      .small { font-size: 12px; fill: #57606a; }
      .tiny { font-size: 11px; fill: #57606a; }
      .line { stroke: #57606a; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <!-- canvas: solid background so it reads well in light and dark GitHub themes -->
  <rect x="0.5" y="0.5" width="1199" height="769" rx="20" fill="#ffffff" stroke="#d0d7de"/>

  <text x="40" y="50" class="sans h1">How the plugin works</text>
  <text x="40" y="76" class="sans sub">enterprise-spring-boot · a Claude Code plugin that designs, builds, checks and documents Spring Boot microservices</text>

  <!-- ===================== Column 1: You + Claude Code ===================== -->
  <rect x="30" y="110" width="220" height="410" rx="14" fill="#fff7f2" stroke="#d97757" stroke-width="2"/>
  <text x="140" y="142" text-anchor="middle" class="sans h2" fill="#9a3412">You + Claude Code</text>
  <circle cx="140" cy="186" r="20" fill="#d97757"/>
  <rect x="112" y="210" width="56" height="34" rx="17" fill="#d97757"/>
  <rect x="48" y="264" width="184" height="124" rx="8" fill="#1f2328"/>
  <circle cx="62" cy="278" r="4" fill="#ff5f57"/><circle cx="76" cy="278" r="4" fill="#febc2e"/><circle cx="90" cy="278" r="4" fill="#28c840"/>
  <text x="60" y="304" class="mono" font-size="12" fill="#e6edf3">$ claude</text>
  <text x="60" y="326" class="mono" font-size="12" fill="#7ee787">&gt; /enterprise-spring-</text>
  <text x="60" y="342" class="mono" font-size="12" fill="#7ee787">  boot:create-service</text>
  <text x="60" y="358" class="mono" font-size="12" fill="#7ee787">  order-service</text>
  <text x="60" y="374" class="mono" font-size="12" fill="#7ee787">  --events both</text>
  <text x="140" y="418" text-anchor="middle" class="sans small">Installed from the</text>
  <text x="140" y="436" text-anchor="middle" class="sans small">marketplace</text>
  <text x="140" y="456" text-anchor="middle" class="mono" font-size="11" fill="#9a3412">jasbir-enterprise</text>
  <text x="140" y="478" text-anchor="middle" class="sans tiny">GitHub: jasbir125/</text>
  <text x="140" y="494" text-anchor="middle" class="sans tiny">claude-ai-spring-boot</text>

  <!-- arrow 1 -> 2 -->
  <line x1="252" y1="315" x2="276" y2="315" class="line" marker-end="url(#arrow)"/>
  <text x="264" y="303" text-anchor="middle" class="sans" font-size="10" fill="#57606a">loads</text>

  <!-- ===================== Column 2: the plugin ===================== -->
  <rect x="280" y="110" width="540" height="410" rx="14" fill="#f8f5ff" stroke="#8250df" stroke-width="2"/>
  <text x="300" y="142" class="sans h2" fill="#6639ba">Plugin <tspan class="mono" font-size="15">enterprise-spring-boot</tspan></text>

  <!-- commands -->
  <text x="300" y="168" class="sans label" fill="#6639ba">COMMANDS · shortcuts you type</text>
  <rect x="300" y="176" width="245" height="46" rx="23" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/>
  <text x="422" y="196" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#6639ba">/create-service</text>
  <text x="422" y="213" text-anchor="middle" class="sans tiny">builds a complete, tested service</text>
  <rect x="555" y="176" width="245" height="46" rx="23" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/>
  <text x="677" y="196" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#6639ba">/review</text>
  <text x="677" y="213" text-anchor="middle" class="sans tiny">checks a change, gives a verdict</text>
  <line x1="422" y1="224" x2="422" y2="244" class="line" marker-end="url(#arrow)"/>
  <line x1="677" y1="224" x2="677" y2="244" class="line" marker-end="url(#arrow)"/>
  <text x="550" y="240" text-anchor="middle" class="sans tiny">run</text>

  <!-- agents -->
  <text x="300" y="262" class="sans label" fill="#0550ae">AGENTS · specialists that do the work</text>
  <rect x="300" y="270" width="245" height="62" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="314" y="295" class="mono" font-size="13" font-weight="700" fill="#0550ae">java-architect</text>
  <text x="314" y="316" class="sans small">Design: boundaries, diagrams</text>
  <rect x="555" y="270" width="245" height="62" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="569" y="295" class="mono" font-size="13" font-weight="700" fill="#0550ae">spring-boot-engineer</text>
  <text x="569" y="316" class="sans small">Build: the service and its tests</text>
  <rect x="300" y="340" width="245" height="62" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="314" y="365" class="mono" font-size="13" font-weight="700" fill="#0550ae">code-reviewer</text>
  <text x="314" y="386" class="sans small">Check: read-only review</text>
  <rect x="555" y="340" width="245" height="62" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="569" y="365" class="mono" font-size="13" font-weight="700" fill="#0550ae">docs-writer</text>
  <text x="569" y="386" class="sans small">Document: README, events, diagrams</text>
  <line x1="550" y1="404" x2="550" y2="424" class="line" marker-end="url(#arrow)"/>
  <text x="560" y="419" class="sans tiny">follow</text>

  <!-- skills -->
  <text x="300" y="440" class="sans label" fill="#116329">SKILLS · the handbook every agent follows</text>
  <rect x="300" y="448" width="104" height="28" rx="14" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="352" y="467" text-anchor="middle" class="mono" font-size="12" fill="#116329">conventions</text>
  <rect x="410" y="448" width="104" height="28" rx="14" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="462" y="467" text-anchor="middle" class="mono" font-size="12" fill="#116329">spring-boot</text>
  <rect x="520" y="448" width="156" height="28" rx="14" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="598" y="467" text-anchor="middle" class="mono" font-size="12" fill="#116329">messaging-patterns</text>
  <rect x="682" y="448" width="118" height="28" rx="14" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="741" y="467" text-anchor="middle" class="mono" font-size="12" fill="#116329">architecture</text>
  <rect x="300" y="484" width="118" height="28" rx="14" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="359" y="503" text-anchor="middle" class="mono" font-size="12" fill="#116329">code-quality</text>
  <text x="430" y="503" class="sans tiny">Lombok first · outbox · no duplicates · Problem Details</text>

  <!-- arrow 2 -> 3 -->
  <line x1="822" y1="315" x2="856" y2="315" class="line" marker-end="url(#arrow)"/>
  <text x="839" y="301" text-anchor="middle" class="sans" font-size="10" fill="#57606a">builds</text>
  <text x="839" y="333" text-anchor="middle" class="sans" font-size="10" fill="#57606a">checks</text>

  <!-- ===================== Column 3: generated microservices ===================== -->
  <rect x="860" y="110" width="310" height="410" rx="14" fill="#effaf9" stroke="#0b7285" stroke-width="2"/>
  <text x="1015" y="142" text-anchor="middle" class="sans h2" fill="#0b5563">Generated microservices</text>

  <rect x="878" y="158" width="274" height="92" rx="10" fill="#ffffff" stroke="#0b7285" stroke-width="1.5"/>
  <text x="892" y="182" class="mono" font-size="13" font-weight="700" fill="#0b5563">user-service</text>
  <text x="892" y="202" class="sans small">user accounts · REST API</text>
  <text x="892" y="220" class="sans tiny">sends UserRegistered, UserDeactivated</text>
  <text x="892" y="237" class="sans tiny">PostgreSQL · Flyway · outbox</text>

  <line x1="1015" y1="252" x2="1015" y2="266" class="line" marker-end="url(#arrow)"/>
  <rect x="878" y="270" width="274" height="40" rx="20" fill="#1f2328"/>
  <text x="1015" y="295" text-anchor="middle" class="mono" font-size="12" fill="#e6edf3">Kafka · user.user.events.v1</text>
  <line x1="1015" y1="312" x2="1015" y2="326" class="line" marker-end="url(#arrow)"/>

  <rect x="878" y="330" width="274" height="92" rx="10" fill="#ffffff" stroke="#0b7285" stroke-width="1.5"/>
  <text x="892" y="354" class="mono" font-size="13" font-weight="700" fill="#0b5563">order-service</text>
  <text x="892" y="374" class="sans small">orders · REST API</text>
  <text x="892" y="392" class="sans tiny">keeps its own user list from the events</text>
  <text x="892" y="409" class="sans tiny">sends OrderPlaced, OrderCancelled</text>

  <text x="892" y="450" class="sans" font-size="12" font-weight="700" fill="#0b5563">Every service comes with</text>
  <text x="892" y="470" class="sans tiny">tests with a real database and Kafka</text>
  <text x="892" y="487" class="sans tiny">Docker Compose · CI · Keycloak login</text>
  <text x="892" y="504" class="sans tiny">README, event contract, diagrams</text>

  <!-- ===================== Bottom: the workflow ===================== -->
  <text x="40" y="574" class="sans label" fill="#57606a">THE WORKFLOW</text>

  <rect x="40" y="586" width="265" height="72" rx="12" fill="#ddf4ff" stroke="#0969da"/>
  <circle cx="74" cy="622" r="17" fill="#0969da"/><text x="74" y="628" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <text x="102" y="616" class="sans" font-size="16" font-weight="700" fill="#0550ae">Design</text>
  <text x="102" y="638" class="mono" font-size="12" fill="#0550ae">java-architect</text>

  <line x1="307" y1="622" x2="323" y2="622" class="line" marker-end="url(#arrow)"/>
  <rect x="325" y="586" width="265" height="72" rx="12" fill="#fbefff" stroke="#8250df"/>
  <circle cx="359" cy="622" r="17" fill="#8250df"/><text x="359" y="628" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <text x="387" y="616" class="sans" font-size="16" font-weight="700" fill="#6639ba">Build</text>
  <text x="387" y="638" class="mono" font-size="12" fill="#6639ba">/create-service</text>

  <line x1="592" y1="622" x2="608" y2="622" class="line" marker-end="url(#arrow)"/>
  <rect x="610" y="586" width="265" height="72" rx="12" fill="#fff8c5" stroke="#bf8700"/>
  <circle cx="644" cy="622" r="17" fill="#bf8700"/><text x="644" y="628" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#ffffff">3</text>
  <text x="672" y="616" class="sans" font-size="16" font-weight="700" fill="#7d4e00">Check</text>
  <text x="672" y="638" class="mono" font-size="12" fill="#7d4e00">/review</text>

  <line x1="877" y1="622" x2="893" y2="622" class="line" marker-end="url(#arrow)"/>
  <rect x="895" y="586" width="265" height="72" rx="12" fill="#dafbe1" stroke="#1a7f37"/>
  <circle cx="929" cy="622" r="17" fill="#1a7f37"/><text x="929" y="628" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#ffffff">4</text>
  <text x="957" y="616" class="sans" font-size="16" font-weight="700" fill="#116329">Document</text>
  <text x="957" y="638" class="mono" font-size="12" fill="#116329">docs-writer</text>

  <text x="600" y="700" text-anchor="middle" class="sans small">The example services in examples/ were built with this workflow and verified with ./mvnw verify</text>
  <text x="600" y="722" text-anchor="middle" class="sans tiny">Skills hold the knowledge · agents do the work · commands chain them into repeatable workflows</text>
</svg>
