spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    web:
      pageable:
        max-page-size: 100
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15433/orders}
    username: ${DB_USERNAME:orders}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      # order lines of a page of orders are loaded in batches, not one query per order
      hibernate.default_batch_fetch_size: 100
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # the outbox stores the serialized envelope (String); the DLT recoverer may re-publish raw bytes
      value-serializer: com.example.order.messaging.config.StringOrBytesSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest       # a new deployment builds the user projection from the start of the topic
      enable-auto-commit: false         # the container commits after the listener (and its transaction) succeeded
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        isolation.level: read_committed
    listener:
      ack-mode: record
      concurrency: ${USER_EVENTS_CONSUMER_CONCURRENCY:1}   # <= partitions of user.user.events.v1
      observation-enabled: true
    template:
      observation-enabled: true

server:
  shutdown: graceful

app:
  security:
    issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8181/realms/orders}
    audience: ${OAUTH2_AUDIENCE:order-service}
  messaging:
    source: ${spring.application.name}
    order-events-topic: ${ORDER_EVENTS_TOPIC:order.order.events.v1}
    user-events-topic: ${USER_EVENTS_TOPIC:user.user.events.v1}
    user-events-dlt-topic: ${USER_EVENTS_DLT_TOPIC:user.user.events.v1.order-service-dlt}
    create-topics: ${KAFKA_CREATE_TOPICS:true}   # false in shared environments (topics provisioned via IaC)
    partitions: ${ORDER_EVENTS_PARTITIONS:3}
    replicas: ${ORDER_EVENTS_REPLICAS:1}         # >= 3 in production
    consumer:
      max-retries: 4
      initial-interval: 500ms
      multiplier: 2.0
      max-interval: 10s
      inbox-retention: ${INBOX_RETENTION:30d}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
    batch-size: 100
    send-timeout: 10s
    retention: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{correlationId:-}] "
  include-application-name: false
