# CI for user-service. GitHub only runs workflows from the repository root: when this service lives in its own
# repository this file works as is; inside the plugin repository it is a reference only.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # unit + slice tests, Testcontainers integration tests (Docker is available on ubuntu runners),
      # enforcer, ArchUnit, event contract tests, JaCoCo gate
      - name: Verify
        run: ./mvnw -B clean verify
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/

  image:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build image (Paketo Buildpacks, non-root)
        run: ./mvnw -B -DskipTests spring-boot:build-image -Dspring-boot.build-image.imageName=user-service:${{ github.sha }}
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: user-service:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
