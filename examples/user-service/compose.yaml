# Local dependencies only. Passwords/secrets below are for local development and must never be reused elsewhere.
name: user-service

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: users
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-users-local}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"   # 15432 avoids clashing with a locally installed PostgreSQL
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d users"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    # single-node KRaft broker; the image defaults advertise localhost:9092
    image: apache/kafka:4.2.2
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  keycloak:
    # OIDC issuer for local tokens: realm "demo" with clients user-service-cli (read+write) and user-service-reader
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-local}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./local/keycloak/demo-realm.json:/opt/keycloak/data/import/demo-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
